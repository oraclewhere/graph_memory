<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graph_memory 单词记忆图</title>
<script src="/static/cytoscape.min.js"></script>
<style>
  :root {
    --surface: #1a1a19;
    --panel: #232322;
    --panel-border: #3a3a38;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --blue-bright: #cde2fb;
    --blue-dim: #3987e5;
    --orange: #eb6834;
    --good: #0ca30c;
    --critical: #e66767;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--surface);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  #cy {
    position: absolute;
    inset: 0;
  }

  #topbar {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: none;
  }
  #topbar h1 { font-size: 15px; font-weight: 600; margin: 0; color: var(--ink); }
  #topbar .hint { font-size: 12px; color: var(--ink-3); }
  #topbar .back {
    pointer-events: auto;
    font-size: 13px;
    color: var(--ink-2);
    text-decoration: none;
    padding: 4px 10px;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    background: var(--panel);
  }
  #topbar .back:hover { color: var(--ink); border-color: var(--blue-dim); }

  #legend {
    position: absolute;
    left: 14px;
    bottom: 14px;
    z-index: 10;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--ink-2);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #legend .row { display: flex; align-items: center; gap: 8px; }
  #legend .bar {
    width: 80px; height: 8px; border-radius: 4px;
    background: linear-gradient(to right, var(--blue-dim), var(--blue-bright));
  }
  #legend .bar-labels {
    display: flex; justify-content: space-between; width: 80px;
    font-size: 10px; color: var(--ink-3);
  }
  #legend .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  #legend .sq { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  /* 填空面板：跟随点击的节点定位 */
  #quiz-panel {
    position: fixed;
    width: 300px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px;
    z-index: 20;
    box-shadow: 0 12px 40px rgba(0,0,0,0.65);
    transition: opacity 0.15s ease;
  }
  #quiz-panel.hidden { opacity: 0; pointer-events: none; }
  .quiz-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .quiz-label { font-size: 12px; color: var(--ink-3); letter-spacing: 0.5px; }
  .panel-close { background: none; border: none; color: var(--ink-3); font-size: 20px; cursor: pointer; line-height: 1; }
  .panel-close:hover { color: var(--ink); }
  #quiz-pos { font-size: 12px; color: var(--blue-bright); margin-bottom: 6px; }
  #quiz-hint { font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 4px; word-break: break-all; }
  #quiz-def-en { font-size: 12px; color: var(--ink-3); margin-bottom: 14px; }
  #quiz-input {
    width: 100%; padding: 11px 13px; font-size: 16px;
    background: #141414; color: var(--ink);
    border: 1px solid var(--panel-border); border-radius: 8px; outline: none;
  }
  #quiz-input:focus { border-color: var(--blue-bright); }
  #quiz-submit {
    width: 100%; margin-top: 10px; padding: 11px; font-size: 15px; font-weight: 600;
    background: var(--blue-dim); color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  #quiz-submit:hover { background: #2f7ad4; }
  #quiz-feedback { margin-top: 12px; font-size: 13px; min-height: 18px; }
  #quiz-feedback.ok { color: var(--good); }
  #quiz-feedback.err { color: var(--critical); }
  #quiz-memory { margin-top: 6px; font-size: 11px; color: var(--ink-3); }

  /* 例句面板：点击例句节点弹出，显示例句 + 翻译，句中单词可点击跳转 */
  #sentence-panel {
    position: fixed;
    width: 340px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px;
    z-index: 20;
    box-shadow: 0 12px 40px rgba(0,0,0,0.65);
    transition: opacity 0.15s ease;
  }
  #sentence-panel.hidden { opacity: 0; pointer-events: none; }
  #sentence-en { font-size: 17px; line-height: 1.7; color: var(--ink); margin: 6px 0 12px; }
  #sentence-en .word-link {
    color: var(--blue-bright);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  #sentence-en .word-link:hover { color: #ffffff; }
  #sentence-zh { font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--panel-border); padding-top: 10px; }

  /* 错误弹窗 */
  #modal {
    position: absolute; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 30; display: flex; align-items: center; justify-content: center;
  }
  #modal.hidden { display: none; }
  .modal-card {
    width: 320px; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 22px; text-align: center;
  }
  .modal-title { font-size: 17px; font-weight: 600; color: var(--critical); margin-bottom: 10px; }
  #modal-answer { font-size: 15px; color: var(--ink-2); margin-bottom: 18px; min-height: 20px; }
  #modal-answer b { color: var(--blue-bright); font-size: 18px; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1; padding: 10px; font-size: 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--panel-border); background: #2b2b2a; color: var(--ink);
  }
  #btn-show-answer { background: var(--blue-dim); border-color: var(--blue-dim); font-weight: 600; }
  #btn-show-answer:hover { background: #2f7ad4; }

  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--ink-3); font-size: 14px; z-index: 5;
  }

  /* 顶部中间：搜索框 */
  #search-wrap {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 14; width: 260px;
  }
  #search-input {
    width: 100%; padding: 9px 12px; font-size: 13px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--panel-border); border-radius: 8px; outline: none;
  }
  #search-input:focus { border-color: var(--blue-bright); }
  #search-input::placeholder { color: var(--ink-3); }
  #search-results {
    margin-top: 4px; background: var(--panel);
    border: 1px solid var(--panel-border); border-radius: 8px;
    max-height: 260px; overflow-y: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,0.65);
  }
  #search-results.hidden { display: none; }
  .sr-item {
    padding: 8px 12px; font-size: 13px; cursor: pointer;
    display: flex; align-items: baseline; gap: 8px;
  }
  .sr-item:hover, .sr-item.active { background: #2f2f2e; }
  .sr-word { font-weight: 600; color: var(--ink); }
  .sr-cn { color: var(--ink-3); font-size: 12px; flex: 1;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sr-empty { padding: 8px 12px; font-size: 12px; color: var(--ink-3); }

  /* 布局切换 */
  #layout-bar {
    position: absolute; top: 60px; right: 14px; z-index: 12;
    display: flex; flex-direction: column; gap: 6px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 10px 12px;
  }
  #layout-bar .lb-title { font-size: 11px; color: var(--ink-3); }
  #layout-bar label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--ink-2); cursor: pointer;
  }
  #layout-bar input { accent-color: var(--blue-dim); margin: 0; }

  /* 右上角「+」：为整张图增词 */
  #grow-btn {
    position: absolute; top: 14px; right: 14px; z-index: 12;
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--blue-dim); color: #fff; border: none;
    font-size: 22px; line-height: 1; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #grow-btn:hover { background: #2f7ad4; }

  /* 单词面板上的「+」：围绕该词造句 */
  .head-btns { display: flex; align-items: center; gap: 2px; }
  .panel-add {
    background: none; border: none; color: var(--blue-bright);
    font-size: 18px; cursor: pointer; line-height: 1; padding: 0 4px;
  }
  .panel-add:hover { color: #ffffff; }

  /* 增词弹窗 */
  #grow-modal {
    position: absolute; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 40; display: flex; align-items: center; justify-content: center;
  }
  #grow-modal.hidden { display: none; }
  .grow-card {
    width: 400px; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 22px;
  }
  .grow-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  .grow-sub { font-size: 12px; color: var(--ink-3); line-height: 1.7; margin-bottom: 20px; }
  .grow-sub b { color: var(--blue-bright); }
  .grow-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; color: var(--ink-2); margin-bottom: 8px;
  }
  .grow-row b { color: var(--blue-bright); font-variant-numeric: tabular-nums; }
  #grow-intensity { width: 100%; accent-color: var(--blue-dim); cursor: pointer; margin: 0; }
  .grow-hint {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--ink-3); margin-top: 6px;
  }
  #grow-preview {
    font-size: 12px; color: var(--ink-2); line-height: 1.7;
    min-height: 36px; margin: 14px 0;
  }
  #grow-preview .sd { color: var(--blue-bright); }
  #grow-preview .dg { color: var(--ink-3); }
  .grow-n {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--ink-2); margin-bottom: 16px;
  }
  .grow-n input {
    width: 76px; padding: 8px 10px; font-size: 14px;
    background: #141414; color: var(--ink);
    border: 1px solid var(--panel-border); border-radius: 8px; outline: none;
  }
  .grow-n input:focus { border-color: var(--blue-bright); }
  #grow-status { font-size: 12px; min-height: 17px; margin-bottom: 12px; }
  #grow-status.loading { color: var(--ink-3); }
  #grow-status.ok { color: var(--good); }
  #grow-status.err { color: var(--critical); }
  #grow-confirm { background: var(--blue-dim); border-color: var(--blue-dim); font-weight: 600; }
  #grow-confirm:hover { background: #2f7ad4; }
  #grow-confirm:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 生成结果：本批例句数 / 新增单词 */
  /* 注：本页没有通用 .hidden 规则（各面板自己定义，quiz/sentence 用 opacity
     做淡出），所以这里按 id 单独声明，避免加通用规则破坏面板过渡动画 */
  #grow-result.hidden, #grow-form.hidden { display: none; }
  #res-label.hidden, #res-none.hidden { display: none; }
  .res-nums { display: flex; gap: 12px; margin-bottom: 14px; }
  .res-num {
    flex: 1; background: #1b1b1a; border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 12px; text-align: center;
  }
  .res-num b { display: block; font-size: 24px; color: var(--blue-bright);
               font-variant-numeric: tabular-nums; line-height: 1.2; }
  .res-num span { font-size: 11px; color: var(--ink-3); }
  .res-label { font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
  #res-words { display: flex; flex-wrap: wrap; gap: 6px; max-height: 150px; overflow-y: auto; }
  .res-chip {
    font-size: 12px; padding: 4px 9px; border-radius: 999px;
    background: #2b2b2a; border: 1px solid var(--panel-border);
    color: var(--blue-bright); cursor: pointer;
  }
  .res-chip:hover { border-color: var(--blue-dim); color: #fff; }
  #res-none { font-size: 12px; color: var(--ink-3); }

  /* 边 tooltip：hover 边时弹出，显示词缀含义 */
  #edge-tooltip {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--ink);
    z-index: 25;
    pointer-events: none;  /* 避免 tooltip 挡住鼠标事件 */
    max-width: 220px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #edge-tooltip.hidden { display: none; }
  #edge-tooltip .et-title { color: var(--blue-bright); font-weight: 600; }
  #edge-tooltip .et-meaning { margin-top: 4px; color: var(--ink-2); line-height: 1.5; }
</style>
</head>
<body>

<div id="cy"></div>
<div id="edge-tooltip" class="hidden"></div>
<div id="loading">加载图中…</div>

<div id="topbar">
  <a class="back" href="/">← 笔记列表</a>
  <h1 id="title">graph_memory</h1>
  <span class="hint">圆形单词填空 · 方形例句看内容 · 右上「＋」增词</span>
</div>

<div id="search-wrap">
  <input id="search-input" type="text" placeholder="搜索单词…（↑↓ 选择，回车定位）"
         autocomplete="off" spellcheck="false">
  <div id="search-results" class="hidden"></div>
</div>

<button id="grow-btn" title="增加新的单词">＋</button>

<div id="layout-bar">
  <span class="lb-title">排布方式</span>
  <label><input type="radio" name="layout" value="force" checked> 力导向</label>
  <label><input type="radio" name="layout" value="memory"> 按记忆度</label>
  <label><input type="radio" name="layout" value="weight"> 按权重</label>
</div>

<div id="legend">
  <div class="row"><span class="bar"></span></div>
  <div class="bar-labels"><span>记忆度低</span><span>记忆度高</span></div>
  <div class="row"><span class="dot" style="background:#eb6834"></span> 分类</div>
  <div class="row"><span class="dot" style="background:#3987e5"></span> 单词（圆形）</div>
  <div class="row"><span class="sq" style="background:#3987e5"></span> 例句（方形，点击看内容、句中单词可跳转）</div>
</div>

<div id="quiz-panel" class="hidden">
  <div class="quiz-head">
    <span class="quiz-label">单词填空</span>
    <span class="head-btns">
      <button id="quiz-add" class="panel-add" title="用这个单词生成新例句">＋</button>
      <button id="quiz-close" class="panel-close" title="关闭">×</button>
    </span>
  </div>
  <div id="quiz-pos"></div>
  <div id="quiz-hint"></div>
  <div id="quiz-def-en"></div>
  <input id="quiz-input" type="text" placeholder="输入英文单词，回车提交" autocomplete="off" spellcheck="false">
  <button id="quiz-submit">提交</button>
  <div id="quiz-feedback"></div>
  <div id="quiz-memory"></div>
</div>

<div id="sentence-panel" class="hidden">
  <div class="quiz-head">
    <span class="quiz-label">例句</span>
    <button id="sentence-close" class="panel-close" title="关闭">×</button>
  </div>
  <div id="sentence-en"></div>
  <div id="sentence-zh"></div>
</div>

<div id="grow-modal" class="hidden">
  <div class="grow-card">
    <div class="grow-title" id="grow-title">是否增加新的单词？</div>
    <div class="grow-sub" id="grow-sub"></div>

    <div id="grow-form">
    <div class="grow-row">
      <span>例句对高权重单词的依赖程度</span>
      <b id="grow-int-val">0.50</b>
    </div>
    <input id="grow-intensity" type="range" min="0" max="100" value="50">
    <div class="grow-hint">
      <span>← 少依赖：挑边缘生词，长出更多新词</span>
      <span>多依赖：围绕核心高频词 →</span>
    </div>

    <div id="grow-preview"></div>

    <div class="grow-n">
      <label for="grow-n-sentences">新增例句数</label>
      <input id="grow-n-sentences" type="number" value="5" min="1" max="30">
    </div>

    <div id="grow-status"></div>
    <div class="modal-btns">
      <button id="grow-cancel">取消</button>
      <button id="grow-confirm">开始生成</button>
    </div>
    </div><!-- /grow-form -->

    <div id="grow-result" class="hidden">
      <div class="res-nums">
        <div class="res-num"><b id="res-sentences">0</b><span>条例句</span></div>
        <div class="res-num"><b id="res-new">0</b><span>个新单词</span></div>
      </div>
      <div class="res-label" id="res-label">本批新增的单词（点击可在图上定位）：</div>
      <div id="res-words"></div>
      <div id="res-none" class="hidden">这一批没有长出新词——说明种子周围已经很密了，
        把滑块往左拖（少依赖高权重词）更容易拽出生词。</div>
      <div class="modal-btns" style="margin-top:16px">
        <button id="res-again">再来一轮</button>
        <button id="res-close" style="background:var(--blue-dim);border-color:var(--blue-dim);font-weight:600">完成</button>
      </div>
    </div>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="modal-card">
    <div class="modal-title">✗ 填写错误</div>
    <div id="modal-answer"></div>
    <div class="modal-btns">
      <button id="btn-retry">再试一次</button>
      <button id="btn-show-answer">显示正确答案</button>
    </div>
  </div>
</div>

<script>
// 记忆度 → 亮度：单色蓝，从「记忆度低（暗）」到「记忆度高（亮）」
const MEM_RAMP = ['#3987e5', '#5598e7', '#6da7ec', '#86b6ef', '#9ec5f4', '#b7d3f6', '#cde2fb'];

function memColor(m) {
  if (m == null) return '#3987e5';
  const clamped = Math.max(0, Math.min(1, m));
  const idx = Math.round(clamped * (MEM_RAMP.length - 1));
  return MEM_RAMP[idx];
}

const state = { cy: null, current: null, pending: null, pendingAnswer: '', unfollowPanel: null };
const $ = (id) => document.getElementById(id);

const CATEGORY = new URLSearchParams(location.search).get('category');
if (CATEGORY) $('title').textContent = CATEGORY;

async function loadGraph() {
  const url = CATEGORY ? '/api/graph?category=' + encodeURIComponent(CATEGORY) : '/api/graph';
  const data = await fetch(url).then((r) => r.json());
  buildCy(data);
}

function buildCy(data) {
  const elements = [];
  data.nodes.forEach((n) => {
    const p = n.properties || {};
    const text = p.text ?? p.name ?? '';
    elements.push({
      data: {
        id: n.id,
        label: n.label,
        text: text,
        pos: p.pos ?? '',
        definition_cn: p.definition_cn ?? '',
        definition_en: p.definition_en ?? '',
        translation: p.translation ?? '',
        words: p.words ?? [],
        memory_strength: p.memory_strength ?? null,
        weight: p.weight ?? null,
      },
    });
  });
  data.edges.forEach((e, i) => {
    elements.push({ data: {
      id: 'e' + i,
      source: e.source,
      target: e.target,
      type: e.type,
      affix: e.affix || '',
      meaning_cn: e.meaning_cn || '',
      meaning_en: e.meaning_en || '',
      display_label: e.display_label || '',
    } });
  });

  state.cy = cytoscape({
    container: $('cy'),
    elements: elements,
    style: [
      {
        selector: 'node',
        style: {
          'color': '#c3c2b7',
          'font-size': 11,
          'text-valign': 'bottom',
          'text-margin-y': 6,
          'text-wrap': 'ellipsis',
          'text-max-width': '90px',
        },
      },
      {
        selector: 'node[label="Word"]',
        style: {
          'shape': 'ellipse',
          'width': 30,
          'height': 30,
          'label': 'data(text)',
          'background-color': (ele) => memColor(ele.data('memory_strength')),
          'border-width': 1.5,
          'border-color': 'rgba(255,255,255,0.35)',
        },
      },
      {
        selector: 'node[label="Sentence"]',
        style: {
          'shape': 'round-rectangle',
          'width': 18,
          'height': 18,
          'label': '',
          'background-color': (ele) => memColor(ele.data('memory_strength')),
          'border-width': 1,
          'border-color': 'rgba(255,255,255,0.35)',
        },
      },
      {
        selector: 'node[label="Category"]',
        style: {
          'shape': 'diamond',
          'width': 46,
          'height': 46,
          'label': 'data(text)',
          'font-size': 13,
          'font-weight': 600,
          'background-color': '#eb6834',
          'border-width': 1.5,
          'border-color': '#f0a37a',
        },
      },
      {
        selector: 'edge',
        style: {
          'width': 1,
          'line-color': '#3a3a38',
          'curve-style': 'bezier',
          'target-arrow-shape': 'triangle',
          'target-arrow-color': '#3a3a38',
          'arrow-scale': 0.7,
          'opacity': 0.7,
        },
      },
      {
        selector: 'node:selected',
        style: { 'border-width': 3, 'border-color': '#ffffff' },
      },
      // 邻接高亮
      { selector: '.dimmed', style: { 'opacity': 0.10 } },
      {
        selector: 'edge.highlighted',
        style: {
          'opacity': 1,
          'line-color': '#cde2fb',
          'target-arrow-color': '#cde2fb',
          'width': 2.5,
          // 边上显示标签（词缀含义）
          'label': (ele) => ele.data('display_label'),
          'font-size': 10,
          'color': '#cde2fb',
          'text-rotation': 'autorotate',  // 标签跟随边旋转
          'text-margin-y': -10,           // 标签偏移，避免压线
          'text-background-color': 'rgba(26, 26, 25, 0.8)',
          'text-background-padding': '3px',
          'text-background-shape': 'round-rectangle',
        },
      },
      { selector: 'node.highlighted', style: { 'opacity': 1 } },
      // hover 边：加粗显示
      { selector: 'edge.hovered', style: { 'opacity': 1, 'width': 2, 'line-color': '#86b6ef' } },
    ],
    layout: layoutOptions(),   // 跟随当前排布方式（力导向 / 记忆度 / 权重）
  });

  state.cy.on('tap', 'node', onNodeTap);
  state.cy.on('mouseover', 'edge', onEdgeMouseOver);
  state.cy.on('mouseout', 'edge', onEdgeMouseOut);
  // 图平移/缩放时隐藏 tooltip（避免位置偏移）
  state.cy.on('pan zoom', () => { $('edge-tooltip').classList.add('hidden'); });

  $('loading').style.display = 'none';
}

function onNodeTap(evt) {
  const node = evt.target;
  const label = node.data('label');
  if (label === 'Word') openQuiz(node);
  else if (label === 'Sentence') openSentencePanel(node);
}

// 边 hover：显示 tooltip（词缀含义）
function onEdgeMouseOver(evt) {
  const edge = evt.target;
  const displayLabel = edge.data('display_label');
  if (!displayLabel) return;  // 无边属性的边不显示 tooltip

  const tooltip = $('edge-tooltip');
  const meaningCn = edge.data('meaning_cn') || '';
  const meaningEn = edge.data('meaning_en') || '';
  const edgeType = edge.data('type');

  // 构造 tooltip 内容
  let titleText = displayLabel;
  let typeDesc = '';
  if (edgeType === 'SHARES_PREFIX') {
    typeDesc = '共享前缀';
  } else if (edgeType === 'SHARES_SUFFIX') {
    typeDesc = '共享后缀';
  } else if (edgeType === 'CONTAINS') {
    typeDesc = '包含单词';
  } else if (edgeType === 'BELONGS_TO') {
    typeDesc = '属于';
  }

  let html = '<div class="et-title">' + escapeHtml(titleText) + '</div>';
  if (typeDesc) {
    html += '<div class="et-meaning">' + escapeHtml(typeDesc) + '</div>';
  }
  if (meaningCn) {
    html += '<div class="et-meaning">含义：' + escapeHtml(meaningCn) + '</div>';
  }
  if (meaningEn) {
    html += '<div class="et-meaning" style="color:var(--ink-3);font-size:11px">(' + escapeHtml(meaningEn) + ')</div>';
  }

  tooltip.innerHTML = html;
  tooltip.classList.remove('hidden');

  // 定位 tooltip（跟随鼠标位置）
  const pos = evt.renderedPosition;
  tooltip.style.left = (pos.x + 15) + 'px';
  tooltip.style.top = (pos.y - 15) + 'px';

  // 确保 tooltip 不超出视口
  requestAnimationFrame(() => {
    const rect = tooltip.getBoundingClientRect();
    if (rect.right > window.innerWidth - 8) {
      tooltip.style.left = (pos.x - rect.width - 15) + 'px';
    }
    if (rect.bottom > window.innerHeight - 8) {
      tooltip.style.top = (pos.y - rect.height - 15) + 'px';
    }
  });
}

function onEdgeMouseOut() {
  $('edge-tooltip').classList.add('hidden');
}

function highlight(node) {
  const cy = state.cy;
  cy.elements().removeClass('dimmed').removeClass('highlighted');
  cy.elements().addClass('dimmed');
  const related = node.closedNeighborhood(); // 自身 + 邻接节点 + 邻接边
  related.removeClass('dimmed').addClass('highlighted');
}

function positionPanel(node, panel) {
  const pos = node.renderedPosition(); // 相对 cy 容器（覆盖整个视口）
  const pw = panel.offsetWidth;
  const ph = panel.offsetHeight;
  // 面板中心对齐节点，向上偏移一点，避免遮住下方输入
  let left = pos.x - pw / 2;
  let top = pos.y - ph / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  top = Math.max(8, Math.min(top, window.innerHeight - ph - 8));
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
}

// 面板跟随节点：图平移/缩放时（含自动跳转的居中动画）持续对齐节点，避免偏移
function bindPanelFollow(node, panel) {
  const follow = () => positionPanel(node, panel);
  state.cy.on('pan zoom', follow);
  return () => { if (state.cy) state.cy.off('pan zoom', follow); };
}

function unbindPanelFollow() {
  if (state.unfollowPanel) { state.unfollowPanel(); state.unfollowPanel = null; }
}

function handleEscape() {
  if (!$('grow-modal').classList.contains('hidden')) {
    closeGrowModal();
    return;
  }
  if (!$('modal').classList.contains('hidden')) {
    $('modal').classList.add('hidden');
    state.pending = null;
  }
  closeQuiz();
  closeSentencePanel();
}

function openQuiz(node) {
  state.current = node;
  const defCn = node.data('definition_cn');
  const defEn = node.data('definition_en');
  $('quiz-pos').textContent = '词性：' + (node.data('pos') || '—');
  $('quiz-hint').textContent = '中文释义：' + (defCn || '—');
  $('quiz-def-en').textContent = '英文释义：' + (defEn || '—');
  $('quiz-input').value = '';
  setFeedback('', '');
  updateMemoryLabel(node);
  $('quiz-panel').classList.remove('hidden');
  unbindPanelFollow();
  state.unfollowPanel = bindPanelFollow(node, $('quiz-panel'));
  $('quiz-input').focus();

  state.cy.elements().unselect();
  node.select();
  highlight(node);
  state.cy.animate({ center: { eles: node }, zoom: 1.1 }, { duration: 250 });
}

function updateMemoryLabel(node) {
  const m = node.data('memory_strength');
  $('quiz-memory').textContent = m != null ? ('记忆度 ' + Math.round(m * 100) + '%') : '';
}

function closeQuiz() {
  $('quiz-panel').classList.add('hidden');
  state.current = null;
  // 刷新图期间 cy 会短暂为 null（reloadGraph 里 destroy 后、重建前）
  if (state.cy) state.cy.elements().removeClass('dimmed').removeClass('highlighted');
  unbindPanelFollow();
}

function openSentencePanel(node) {
  state.current = node;
  const en = $('sentence-en');
  en.innerHTML = '';
  en.appendChild(renderSentenceText(node.data('text'), node.data('words') || []));
  $('sentence-zh').textContent = node.data('translation') || '';
  $('sentence-panel').classList.remove('hidden');
  unbindPanelFollow();
  state.unfollowPanel = bindPanelFollow(node, $('sentence-panel'));

  state.cy.elements().unselect();
  node.select();
  highlight(node);
  state.cy.animate({ center: { eles: node }, zoom: 1.1 }, { duration: 250 });
}

function closeSentencePanel() {
  $('sentence-panel').classList.add('hidden');
  state.current = null;
  if (state.cy) state.cy.elements().removeClass('dimmed').removeClass('highlighted');
  unbindPanelFollow();
}

// 把英文句子按词切分，每个词拆成 [前缀标点, 字母核心, 后缀标点]，便于匹配词形
function tokenize(text) {
  return text.split(/\s+/).filter(Boolean).map((tok) => {
    const m = tok.match(/^([^A-Za-z]*)([A-Za-z]+)([^A-Za-z]*)$/);
    if (m) return { prefix: m[1], core: m[2], suffix: m[3], norm: m[2].toLowerCase() };
    return { prefix: '', core: tok, suffix: '', norm: tok.toLowerCase() };
  });
}

// 优先精确匹配，否则用最长前缀匹配（覆盖 passages→passage、analyzing→analyze）
function matchWord(norm, words) {
  if (words.includes(norm)) return norm;
  let best = null;
  for (const w of words) {
    if (w.length >= 3 && norm.startsWith(w) && (!best || w.length > best.length)) best = w;
  }
  return best;
}

function renderSentenceText(text, words) {
  const frag = document.createDocumentFragment();
  tokenize(text).forEach((t) => {
    if (t.prefix) frag.appendChild(document.createTextNode(t.prefix));
    const matched = matchWord(t.norm, words);
    if (matched) {
      const span = document.createElement('span');
      span.className = 'word-link';
      span.textContent = t.core;
      span.title = '跳到单词 ' + matched;
      span.addEventListener('click', () => jumpToWord(matched));
      frag.appendChild(span);
    } else {
      frag.appendChild(document.createTextNode(t.core));
    }
    if (t.suffix) frag.appendChild(document.createTextNode(t.suffix));
    frag.appendChild(document.createTextNode(' '));
  });
  return frag;
}

function jumpToWord(wordText) {
  const target = state.cy.getElementById('word:' + wordText);
  if (!target.length) return;
  closeSentencePanel();
  openQuiz(target[0]);
}

function setFeedback(msg, cls) {
  const el = $('quiz-feedback');
  el.textContent = msg;
  el.className = cls;
}

function submitAnswer() {
  if (!state.current) return;
  const input = $('quiz-input').value.trim().toLowerCase();
  const answer = state.current.data('text').toLowerCase();
  if (!input) return;

  if (input === answer) {
    setFeedback('记忆成功 ✓', 'ok');
    markReviewed(state.current);
  } else {
    state.pending = state.current;
    state.pendingAnswer = answer;
    $('modal-answer').innerHTML = '';
    $('modal').classList.remove('hidden');
  }
}

async function markReviewed(node) {
  const text = node.data('text');
  let res;
  try {
    res = await fetch('/api/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ word: text }),
    }).then((r) => r.json());
  } catch (e) {
    setFeedback('更新失败：后端未响应', 'err');
    return;
  }

  node.data('memory_strength', res.memory_strength ?? 1.0);
  state.cy.style().update();

  const next = res.next;
  if (next && next.text) {
    const nextNode = state.cy.getElementById('word:' + next.text);
    if (nextNode.length) {
      setTimeout(() => openQuiz(nextNode[0]), 300);
      return;
    }
  }
  closeQuiz();
}

// --- 搜索：顶部中间输入框，定位并选中单词 ---

const search = { matches: [], active: -1 };

function allWordNodes() {
  return state.cy ? state.cy.nodes('[label="Word"]') : [];
}

function runSearch(raw) {
  const q = raw.trim().toLowerCase();
  const box = $('search-results');
  if (!q) { hideSearch(); return; }

  const hits = [];
  allWordNodes().forEach((n) => {
    const text = String(n.data('text') || '').toLowerCase();
    const cn = String(n.data('definition_cn') || '');
    // 英文前缀优先，其次英文包含，最后中文释义包含
    let rank = -1;
    if (text.startsWith(q)) rank = 0;
    else if (text.includes(q)) rank = 1;
    else if (cn.includes(raw.trim())) rank = 2;
    if (rank >= 0) hits.push({ node: n, rank: rank, text: text });
  });
  hits.sort((a, b) => (a.rank - b.rank) || a.text.localeCompare(b.text));

  search.matches = hits.slice(0, 8).map((h) => h.node);
  search.active = search.matches.length ? 0 : -1;
  renderSearchResults(hits.length);
  box.classList.remove('hidden');
}

function renderSearchResults(total) {
  const box = $('search-results');
  box.innerHTML = '';
  if (!search.matches.length) {
    const d = document.createElement('div');
    d.className = 'sr-empty';
    d.textContent = '没有匹配的单词';
    box.appendChild(d);
    return;
  }
  search.matches.forEach((n, i) => {
    const row = document.createElement('div');
    row.className = 'sr-item' + (i === search.active ? ' active' : '');
    const w = document.createElement('span');
    w.className = 'sr-word';
    w.textContent = n.data('text');
    const cn = document.createElement('span');
    cn.className = 'sr-cn';
    cn.textContent = n.data('definition_cn') || '';
    row.appendChild(w);
    row.appendChild(cn);
    row.addEventListener('mousedown', (e) => { e.preventDefault(); pickSearch(i); });
    box.appendChild(row);
  });
  if (total > search.matches.length) {
    const more = document.createElement('div');
    more.className = 'sr-empty';
    more.textContent = '另有 ' + (total - search.matches.length) + ' 个匹配，请输入更多字符';
    box.appendChild(more);
  }
}

function moveSearchActive(delta) {
  if (!search.matches.length) return;
  search.active = (search.active + delta + search.matches.length) % search.matches.length;
  renderSearchResults(search.matches.length);
}

function pickSearch(i) {
  const node = search.matches[i];
  if (!node) return;
  hideSearch();
  $('search-input').blur();
  openQuiz(node);          // 选中 + 居中 + 邻接高亮 + 打开填空面板
}

function hideSearch() {
  $('search-results').classList.add('hidden');
  search.matches = [];
  search.active = -1;
}

$('search-input').addEventListener('input', (e) => runSearch(e.target.value));
$('search-input').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveSearchActive(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSearchActive(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); pickSearch(search.active); }
  // 搜索框里的 Esc 只收起候选，不要冒泡到全局 Esc（那会连带关掉填空面板）
  else if (e.key === 'Escape') {
    e.preventDefault(); e.stopPropagation();
    hideSearch(); $('search-input').blur();
  }
});
$('search-input').addEventListener('blur', () => setTimeout(hideSearch, 120));

// --- 排布方式：力导向 / 按记忆度 / 按权重（值越大越靠圆心）---

let layoutMode = 'force';

function layoutOptions() {
  if (layoutMode === 'force') {
    return {
      name: 'cose', animate: false, nodeOverlap: 24, nodeRepulsion: 9000,
      idealEdgeLength: 90, edgeElasticity: 90, gravity: 0.25, numIter: 1500,
    };
  }
  // concentric：返回值越大，节点排得越靠近圆心
  return {
    name: 'concentric',
    animate: false,
    concentric: concentricValue,
    levelWidth: () => 1,          // 每一档一圈，避免全挤成一两圈
    minNodeSpacing: 22,
    equidistant: false,
    avoidOverlap: true,
  };
}

function concentricValue(node) {
  const label = node.data('label');
  if (label === 'Category') return 100;      // 分类恒在最中心
  if (layoutMode === 'memory') {
    // 记忆度 0~1 → 分成 11 档，记得越牢越靠中心
    return Math.round((node.data('memory_strength') ?? 0) * 10);
  }
  // 权重：度中心性（后端给），缺失时退回图内实际度数
  const w = node.data('weight');
  return (w == null) ? node.degree() : w;
}

function applyLayout(mode) {
  layoutMode = mode;
  if (!state.cy) return;
  state.cy.layout(layoutOptions()).run();
  state.cy.fit(undefined, 40);
}

document.querySelectorAll('input[name="layout"]').forEach((el) => {
  el.addEventListener('change', () => { if (el.checked) applyLayout(el.value); });
});

// --- 增词：右上角「+」= 给整张图增词；单词面板「+」= 围绕该词造句 ---
// 两者共用一个弹窗，区别只在有没有「焦点词」。
// 滑块 = 例句对高权重单词的依赖程度：高则种子取核心高频词，低则取边缘生词。

const grow = { focus: null, timer: null };
const GROW_SEEDS = 5;   // 每轮种子数（焦点词模式下 = 焦点词 + 4 个陪衬词）

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function growIntensity() {
  return (parseInt($('grow-intensity').value, 10) || 0) / 100;
}

function setGrowStatus(msg, cls) {
  const el = $('grow-status');
  el.textContent = msg;
  el.className = cls || '';
}

function openGrowModal(focusWord) {
  grow.focus = focusWord || null;
  $('grow-title').textContent = '是否增加新的单词？';
  $('grow-sub').innerHTML = grow.focus
    ? '围绕单词 <b>' + escapeHtml(grow.focus) + '</b> 生成新例句，句中出现的新词会自动入图。'
    : '为「<b>' + escapeHtml(CATEGORY || '') + '</b>」生成新例句，句中出现的新词会自动入图。';
  setGrowStatus('', '');
  $('grow-form').classList.remove('hidden');    // 回到表单视图（可能上次停在结果视图）
  $('grow-result').classList.add('hidden');
  $('grow-modal').classList.remove('hidden');
  previewGrowSeeds();
}

// 生成完成后把弹窗切到结果视图：本批多少例句、新增多少单词
function showGrowResult(res) {
  const newWords = res.new_words || [];
  $('grow-title').textContent = '✓ 本批已生成';
  $('grow-sub').innerHTML = '种子：<b>' + (res.seeds || []).map(escapeHtml).join('、') + '</b>';
  $('res-sentences').textContent = (res.sentences || []).length;
  $('res-new').textContent = newWords.length;

  const box = $('res-words');
  box.innerHTML = '';
  newWords.forEach((w) => {
    const chip = document.createElement('span');
    chip.className = 'res-chip';
    chip.textContent = w;
    chip.title = '在图上定位 ' + w;
    chip.addEventListener('click', () => {
      const node = state.cy && state.cy.getElementById('word:' + w);
      if (node && node.length) { closeGrowModal(); openQuiz(node[0]); }
    });
    box.appendChild(chip);
  });
  $('res-label').classList.toggle('hidden', newWords.length === 0);
  $('res-none').classList.toggle('hidden', newWords.length > 0);

  $('grow-form').classList.add('hidden');
  $('grow-result').classList.remove('hidden');
}

function closeGrowModal() {
  $('grow-modal').classList.add('hidden');
  grow.focus = null;
}

function scheduleGrowPreview() {
  $('grow-int-val').textContent = growIntensity().toFixed(2);
  clearTimeout(grow.timer);
  grow.timer = setTimeout(previewGrowSeeds, 250);
}

async function previewGrowSeeds() {
  $('grow-int-val').textContent = growIntensity().toFixed(2);
  const box = $('grow-preview');
  if (!CATEGORY) { box.textContent = ''; return; }
  const q = new URLSearchParams({
    category: CATEGORY,
    intensity: String(growIntensity()),
    k: String(GROW_SEEDS),
  });
  if (grow.focus) q.set('focus', grow.focus);
  try {
    const res = await fetch('/api/seeds?' + q).then((r) => r.json());
    const parts = (res.words || []).map((w) =>
      '<span class="sd">' + escapeHtml(w.text) + '</span><span class="dg">(' + w.weight + '度)</span>');
    if (grow.focus) {
      box.innerHTML = '种子：<span class="sd">' + escapeHtml(grow.focus) + '</span>（焦点）' +
        (parts.length ? '，陪衬 ' + parts.join('、') : '');
    } else if (res.cold_start) {
      box.textContent = '该分类图里还没有单词，将由 LLM 冷启动生成种子';
    } else {
      box.innerHTML = '种子：' + parts.join('、');
    }
  } catch (e) {
    box.textContent = '';
  }
}

async function confirmGrow() {
  if (!CATEGORY) return;
  const focusWord = grow.focus;   // 请求期间弹窗可能被关，先存下来
  setGrowStatus('正在生成例句并入图…（可能需几十秒）', 'loading');
  $('grow-confirm').disabled = true;
  try {
    const res = await fetch('/api/automake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        category: CATEGORY,
        seeds: [],                          // 空 = 交给后端按强度选
        focus_word: focusWord || '',
        intensity: growIntensity(),
        n_seeds: GROW_SEEDS,
        n_sentences: parseInt($('grow-n-sentences').value, 10) || 5,
      }),
    }).then((r) => r.json());
    if (res.ok) {
      setGrowStatus('生成完毕，正在刷新图…', 'ok');
      await reloadGraph();          // 先刷图，结果面板里的单词才点得到
      showGrowResult(res);
    } else {
      setGrowStatus('生成失败', 'err');
    }
  } catch (e) {
    setGrowStatus('生成失败：后端未响应或 LLM 未配置', 'err');
  } finally {
    $('grow-confirm').disabled = false;
  }
}

async function reloadGraph() {
  closeQuiz();                 // 先收面板（此时 cy 还在）
  closeSentencePanel();
  hideSearch();                // 候选里存的是旧 cy 的节点引用，作废
  if (state.cy) { state.cy.destroy(); state.cy = null; }
  $('loading').textContent = '刷新图中…';
  $('loading').style.display = 'flex';
  await loadGraph();
}

$('grow-btn').onclick = () => openGrowModal(null);
$('grow-cancel').onclick = closeGrowModal;
$('res-close').onclick = closeGrowModal;
$('res-again').onclick = () => openGrowModal(grow.focus);   // 保持同一个焦点词再来一轮
$('grow-confirm').onclick = confirmGrow;
$('grow-intensity').oninput = scheduleGrowPreview;
$('quiz-add').onclick = () => {
  if (state.current) openGrowModal(state.current.data('text'));
};

// 增词需要明确的分类（写库要落到某个 Category），整图视图下不提供
if (!CATEGORY) {
  $('grow-btn').style.display = 'none';
  $('quiz-add').style.display = 'none';
}

$('quiz-submit').onclick = submitAnswer;
$('quiz-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitAnswer();
});
$('quiz-close').onclick = closeQuiz;
$('sentence-close').onclick = closeSentencePanel;

$('btn-retry').onclick = () => {
  $('modal').classList.add('hidden');
  $('quiz-input').value = '';
  $('quiz-input').focus();
  state.pending = null;
};

$('btn-show-answer').onclick = () => {
  $('modal-answer').innerHTML = '正确答案：<b>' + state.pendingAnswer + '</b>';
  const node = state.pending;
  state.pending = null;
  $('modal').classList.add('hidden');
  setFeedback('已显示答案，记忆成功 ✓', 'ok');
  markReviewed(node);
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') handleEscape();
});

loadGraph().catch((e) => {
  $('loading').textContent = '加载失败：请确认后端服务已启动（uvicorn app.main:app）';
});
</script>
</body>
</html>
