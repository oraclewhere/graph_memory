# 英文词法词缀清单（可扩展）。用于建立单词之间的 SHARES_PREFIX / SHARES_SUFFIX 边。
# 格式：每个词缀包含 affix（词缀本身）、meaning_cn（中文含义）、meaning_en（英文含义）
# 匹配方式：单词 startswith(前缀) / endswith(后缀)，简单字符串匹配。
# 注意：v1 为简单字符串匹配，可能产生噪音边（如前缀 "un" 会同时匹配 "under"/"uncle"）。
#       只收录「派生词缀」，不收屈折词缀（-ing/-ed/-s 等会造成海量噪音边）。

prefixes:
  - affix: "un"
    meaning_cn: "不，非，未"
    meaning_en: "not, opposite of"
  - affix: "re"
    meaning_cn: "再，重新，回"
    meaning_en: "again, back"
  - affix: "pre"
    meaning_cn: "预先，在…之前"
    meaning_en: "before"
  - affix: "dis"
    meaning_cn: "不，无，分离"
    meaning_en: "not, apart"
  - affix: "mis"
    meaning_cn: "错误，不当"
    meaning_en: "wrongly, badly"
  - affix: "over"
    meaning_cn: "过度，超过"
    meaning_en: "too much, beyond"
  - affix: "under"
    meaning_cn: "不足，在…之下"
    meaning_en: "too little, beneath"
  - affix: "inter"
    meaning_cn: "相互，之间"
    meaning_en: "between, among"
  - affix: "sub"
    meaning_cn: "在…之下，次级"
    meaning_en: "under, below"
  - affix: "con"
    meaning_cn: "共同，一起"
    meaning_en: "together, with"
  - affix: "ex"
    meaning_cn: "出，向外，前任"
    meaning_en: "out, former"
  - affix: "pro"
    meaning_cn: "向前，支持"
    meaning_en: "forward, in favor of"
  - affix: "trans"
    meaning_cn: "跨越，转移"
    meaning_en: "across, beyond"
  - affix: "anti"
    meaning_cn: "反对，对抗"
    meaning_en: "against"

suffixes:
  - affix: "tion"
    meaning_cn: "动作，状态（名词后缀）"
    meaning_en: "action, state (noun)"
  - affix: "sion"
    meaning_cn: "动作，状态（名词后缀）"
    meaning_en: "action, state (noun)"
  - affix: "ment"
    meaning_cn: "结果，手段（名词后缀）"
    meaning_en: "result, means (noun)"
  - affix: "ness"
    meaning_cn: "状态，性质（名词后缀）"
    meaning_en: "state, quality (noun)"
  - affix: "ful"
    meaning_cn: "充满…的（形容词后缀）"
    meaning_en: "full of (adj)"
  - affix: "less"
    meaning_cn: "无…的（形容词后缀）"
    meaning_en: "without (adj)"
  - affix: "able"
    meaning_cn: "能够…的（形容词后缀）"
    meaning_en: "can be (adj)"
  - affix: "ible"
    meaning_cn: "能够…的（形容词后缀）"
    meaning_en: "can be (adj)"
  - affix: "ity"
    meaning_cn: "性质，状态（名词后缀）"
    meaning_en: "quality, state (noun)"
  - affix: "ive"
    meaning_cn: "有…倾向的（形容词后缀）"
    meaning_en: "tending to (adj)"
  - affix: "al"
    meaning_cn: "与…有关的（形容词后缀）"
    meaning_en: "relating to (adj)"
  - affix: "ous"
    meaning_cn: "具有…特征的（形容词后缀）"
    meaning_en: "having quality of (adj)"
  - affix: "er"
    meaning_cn: "从事…的人/物（名词后缀）"
    meaning_en: "one who does (noun)"
  - affix: "or"
    meaning_cn: "从事…的人/物（名词后缀）"
    meaning_en: "one who does (noun)"
  - affix: "ism"
    meaning_cn: "主义，学说（名词后缀）"
    meaning_en: "doctrine, system (noun)"
  - affix: "ist"
    meaning_cn: "从事…的人（名词后缀）"
    meaning_en: "one who practices (noun)"
