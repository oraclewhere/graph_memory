services:
  neo4j:
    image: neo4j:5
    container_name: graph_memory_neo4j
    ports:
      - "7474:7474"   # HTTP browser (http://localhost:7474)
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data

  mysql:
    image: mysql:8
    container_name: graph_memory_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=graph_memory
      - MYSQL_USER=app
      - MYSQL_PASSWORD=apppass
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  neo4j_data:
  mysql_data:
