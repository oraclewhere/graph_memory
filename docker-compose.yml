services:
  neo4j:
    image: neo4j:5
    container_name: graph_memory_neo4j
    ports:
      - "7474:7474"   # HTTP browser (http://localhost:7474)
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
